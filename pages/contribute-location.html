<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contribute a Place</title>

  <!-- CSS -->
  <link rel="stylesheet" href="../css/contribute.css">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>

<body>

<header class="main-header">
  <div class="header-container">
    <div class="header-logo">
      <img src="../assets/images/logo.svg" alt="LFP Logo">
      <span>LFP</span>
    </div>
    <div class="header-search">
      <input type="text" placeholder="Search places...">
      <i class="fa fa-search"></i>
    </div>
  </div>
</header>

<nav class="sidebar">
  <ul class="nav-links">
    <li><a href="home.html"><i class="fa-solid fa-house"></i></a></li>
    <li class="active"><a href="contribute.html"><i class="fa-solid fa-users"></i></a></li>
    <li><a href="places.html"><i class="fa-solid fa-map"></i></a></li>
    <li><a href="fav.html"><i class="fa-regular fa-heart"></i></a></li>
  </ul>
</nav>

<div class="card">
  <h2>Contribute a Place</h2>

  <form id="contribute-form">

    <label>Name *</label>
    <input id="placeName" type="text" required>

    <label>Category *</label>
    <select id="category" required>
      <option value="">Select</option>
      <option value="Cafe">Cafe</option>
      <option value="Hotel">Hotel</option>
    </select>

    <label>Description</label>
    <textarea id="description"></textarea>

    <label>Select Location *</label>
    <div id="map"></div>

    <label>Wi-Fi</label>
    <select id="wifi">
      <option value="good">Good</option>
      <option value="average">Average</option>
      <option value="bad">Bad</option>
    </select>

    <label>Power</label>
    <select id="power">
      <option value="good">Good</option>
      <option value="average">Average</option>
      <option value="bad">Bad</option>
    </select>

    <label>Customer Service</label>
    <select id="service">
      <option value="good">Good</option>
      <option value="average">Average</option>
      <option value="bad">Bad</option>
    </select>

    <label>Overall Rating *</label>
    <input type="hidden" id="overallRating">
    <div class="stars">
      <span data-value="1">★</span>
      <span data-value="2">★</span>
      <span data-value="3">★</span>
      <span data-value="4">★</span>
      <span data-value="5">★</span>
    </div>

    <label>Images (1–3)</label>
    <div class="upload-box" id="photoBox">Upload Images</div>
    <input type="file" id="photoInput" multiple accept="image/*" hidden>
    <div id="imagePreview" class="preview-row"></div>

    <label>Video (optional)</label>
    <div class="upload-box" id="videoBox">Upload Video</div>
    <input type="file" id="videoInput" accept="video/*" hidden>
    <div id="videoPreview" class="preview-row"></div>

    <input type="hidden" id="lat">
    <input type="hidden" id="lng">

    <button type="submit">Submit</button>
  </form>
</div>

<!-- Leaflet JS FIRST -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Your JS -->
<script type="module" src="../js/contribute.js"></script>

</body>
</html>
