<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LFP Dashboard</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        .map-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
        }
        .preview-map {
            position: relative;
            height: 400px;
            border-radius: 12px;
        }
        #homeMap {
            width: 100%;
            height: 100%;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<header class="main-header">
    <div class="header-container">
        <div class="header-logo">
            <img src="../assets/images/logo.svg" alt="LFP Logo">
            <span>LFP</span>
        </div>
        <div class="header-profile-icon">
            <i id="headerProfile" class="fa-regular fa-user"></i>
        </div>
    </div>
</header>

<div class="container">
    <nav class="sidebar">
        <ul class="nav-links">
            <li class="active">
                <a href="home.html" title="Home"><i class="fa-solid fa-house"></i></a>
            </li>
            <li>
                <a href="contribute-location.html" title="Contribute"><i class="fa-solid fa-users"></i></a>
            </li>
            <li>
                <a href="places.html" title="Places"><i class="fa-solid fa-map"></i></a>
            </li>
            <li>
                <a href="fav.html" title="Favorite"><i class="fa-regular fa-heart"></i></a>
            </li>
        </ul>
        <div class="sidebar-bottom">
            <i id="profile" class="fa-regular fa-user"></i>
        </div>
    </nav>

    <main class="main">
        <div class="stats">
            <div class="card">
                <i class="fa-solid fa-map"></i>
                <div class="card-content">
                    <h3>Total places</h3>
                    <p id="totalPlaces">Loading...</p>
                </div>
            </div>
            <div class="card">
                <i class="fa-solid fa-plus-circle"></i>
                <div class="card-content">
                    <h3>New added</h3>
                    <p id="newAdded">Loading...</p>
                </div>
            </div>
            <div class="card">
                <i class="fa-solid fa-people-group"></i>
                <div class="card-content">
                    <h3>Contributors</h3>
                    <p id="totalContributors">Loading...</p>
                </div>
            </div>
        </div>

        <h2 class="title">Places around your area</h2>

        <div class="map-section">
            <div class="map-container preview-map">
                <div id="homeMap"></div>
                <div class="map-overlay">
                    <a href="map-view.html" class="view-btn">View more</a>
                </div>
            </div>

            <div class="places-sidebar">
                <div class="places-category">
                    <div class="category-header">
                        <i class="fa-solid fa-location-dot"></i>
                        <span>Total places</span>
                    </div>
                    <span class="category-count" id="sidebarTotalPlaces">Loading...</span>
                </div>
                <div class="places-category">
                    <div class="category-header">
                        <i class="fa-solid fa-mug-saucer"></i>
                        <span>Cafe</span>
                    </div>
                    <span class="category-count" id="cafeCount">Loading...</span>
                </div>
                <div class="places-category">
                    <div class="category-header">
                        <i class="fa-solid fa-hotel"></i>
                        <span>Hotel</span>
                    </div>
                    <span class="category-count" id="hotelCount">Loading...</span>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="../js/home.js"></script>

</body>
</html>
