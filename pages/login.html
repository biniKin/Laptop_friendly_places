<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Sign Up - LFP</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="bg"></div>

    <div class="container">
        <div class="form-box glass">
            <!-- Logo/Branding -->
            <div class="login-logo">
                <img src="../assets/images/logo.svg" alt="LFP Logo">
                <h1>LFP</h1>
                <p>Laptop Friendly Places</p>
            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm" class="form active">
                <h2>Welcome Back</h2>

                <input type="email" id="loginEmail" placeholder="Email" required>
                <small class="error" id="loginEmailError"></small>

                <div class="password-box">
                    <input type="password" id="loginPassword" placeholder="Password" required>
                    <i class="fa-solid fa-eye toggle" data-target="loginPassword"></i>
                </div>
                <small class="error" id="loginPasswordError"></small>

                <div class="msg" id="loginMsg"></div>

                <button type="submit">
                    <span class="btn-text">Login</span>
                    <span class="spinner"></span>
                </button>

                <p class="switch">
                    Don't have an account?
                    <span id="showSignup">Sign Up</span>
                </p>
            </form>

            <!-- SIGN UP FORM -->
            <form id="signupForm" class="form">
                <h2>Create Account</h2>

                <input type="text" id="signupName" placeholder="Full Name" required>
                <small class="error" id="signupNameError"></small>

                <input type="email" id="signupEmail" placeholder="Email" required>
                <small class="error" id="signupEmailError"></small>

                <div class="password-box">
                    <input type="password" 
                        id="signupPassword" 
                        placeholder="Password (min 6 characters)"
                        minlength="6"
                        required>
                    <i class="fa-solid fa-eye toggle" data-target="signupPassword"></i>
                </div>
                <small class="error" id="signupPasswordError"></small>

                <div class="password-box">
                    <input type="password" id="signupConfirm" placeholder="Confirm Password" required>
                    <i class="fa-solid fa-eye toggle" data-target="signupConfirm"></i>
                </div>
                <small class="error" id="signupConfirmError"></small>

                <div class="msg" id="message"></div>

                <button type="submit">
                    <span class="btn-text">Sign Up</span>
                    <span class="spinner"></span>
                </button>

                <p class="switch">
                    Already have an account?
                    <span id="showLogin">Login</span>
                </p>
            </form>

        </div>
    </div>
    <script type="module" src="../js/login.js"></script>
</body>
</html>
